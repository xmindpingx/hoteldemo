# Aider project config for /home/dad/wwwhotel/hoteldemosite (the hotel website + admin CMS).
# Overrides ~/.aider.conf.yml. Launch with:  aider-hoteldemo   (or ./start_aider.sh)
#
# Models, edit formats, num_ctx and context limits come from:
#   ~/.aider.model.settings.yml + ~/.aider.model.metadata.json   (gemma4:12b architect, qwen2.5-coder:7b editor)
#   ./.aider.model.settings.yml + ./.aider.model.metadata.json   (adds qwen2.5-coder:14b as a SOLO model @24k;
#                                                                 the launcher uses .aider.solo.conf.yml for it)

# ---- architect mode (planner + editor) --------------------------------------------------
architect: true
model: ollama_chat/gemma4:12b
editor-model: ollama_chat/qwen2.5-coder:7b-instruct
editor-edit-format: editor-diff
auto-accept-architect: false      # show the plan, ask y/n before the editor touches files

# ---- standing context, loaded read-only every session ----------------------------------
read:
  - CONVENTIONS.md
  - README.md
  - docs/OPERATIONS.md
# On demand (ask aider to plan after you /read one): docs/GODADDY-CUTOVER.md, docs/SEO-ENGINE.md

# ---- repo map: small, so prompts fit in the 24k architect window -----------------------
map-tokens: 1536
map-refresh: auto

# ---- lint / test ------------------------------------------------------------------------
# Syntax-check every edited .js file (node --check) and feed errors back to the model.
auto-lint: true
lint-cmd:
  - "javascript: node --check"
  - "bash: bash -n"
# /test = syntax/load/EJS checks, then boot a throwaway server copy on a free port with temp data and
# hit every route + the admin API (scripts/smoke.sh). Never touches pm2 or data/.
test-cmd: "bash scripts/aider-test.sh && bash scripts/smoke.sh && bash scripts/smoke-superadmin.sh"
auto-test: false

# ---- git --------------------------------------------------------------------------------
auto-commits: true
dirty-commits: true
attribute-author: true
attribute-committer: true
gitignore: false               # .aider.* files are tracked in this repo on purpose; do not add them to .gitignore
# One-line commit messages a small local model can get right every time.
commit-prompt: |
  Write the git commit message for the diff the user sends.
  Output exactly one line, at most 72 characters, imperative mood, no quotes, no markdown, no trailing period.
  Start with the area and a colon, using one of: ui, css, server, admin, api, seo, docs, scripts, data.
  Example: admin: fix room status toggle not saving to data store

# ---- UI ---------------------------------------------------------------------------------
dark-mode: true
pretty: true
stream: true
check-update: false            # offline box; do not phone home for aider updates on every launch
show-model-warnings: false     # local Ollama models are not in aider's catalog; the warning is noise
suggest-shell-commands: false  # the human runs commands deliberately (/run …); the model only names them
analytics-disable: true
# Commit messages are written by the (cheaper) editor model; the architect stays free for planning.
weak-model: ollama_chat/qwen2.5-coder:7b-instruct
