# SOLO config: used by start_aider.sh when the model is qwen2.5-coder:14b (no architect/editor split,
# because 14b + 7b do not fit in 16 GB together). Everything else mirrors .aider.conf.yml.
# Launch:  aider-hoteldemo --model ollama_chat/qwen2.5-coder:14b   (or: aider -c .aider.solo.conf.yml)
# num_ctx 24576 for the 14b comes from ./.aider.model.settings.yml.

model: ollama_chat/qwen2.5-coder:14b
edit-format: diff

# ---- standing context, loaded read-only every session ----------------------------------
read:
  - CONVENTIONS.md
  - README.md

# ---- repo map: small, so prompts fit in the 24k architect window -----------------------
map-tokens: 1536
map-refresh: auto

# ---- lint / test ------------------------------------------------------------------------
# Syntax-check every edited .js file (node --check) and feed errors back to the model.
auto-lint: true
lint-cmd:
  - "javascript: node --check"
# /test = syntax-check the whole server + confirm the data store loads. Never restarts pm2.
test-cmd: "bash scripts/aider-test.sh"
auto-test: false

# ---- git --------------------------------------------------------------------------------
auto-commits: true
dirty-commits: true
attribute-author: true
attribute-committer: true

# ---- UI ---------------------------------------------------------------------------------
dark-mode: true
pretty: true
stream: true
